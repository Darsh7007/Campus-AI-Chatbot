spring.application.name=campus-ai-chatbot
server.port=${PORT:8080}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
chatbot.system-instruction=${CHATBOT_SYSTEM_INSTRUCTION:You are Campus AI, a friendly and helpful assistant for students. Answer accurately, explain ideas clearly for beginners, and use readable formatting. For coding questions, include useful examples. If you are uncertain, say so.}
